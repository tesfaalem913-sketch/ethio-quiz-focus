        "@context": "https://schema.org",

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      if ('serviceWorker' in navigator) {
        const registerSW = () => {
          // If in development/preview/localhost environments, unregister service workers to avoid stale cache lock
          const isDevOrPreview = window.location.hostname.includes('ais-dev-') || 
                                 window.location.hostname.includes('ais-pre-') || 
                                 window.location.hostname.includes('localhost') || 
                                 window.location.search.includes('clear');
          
          if (isDevOrPreview) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
              for (let registration of registrations) {
                registration.unregister().then(() => {
                  console.log('Service worker cleared in preview environment to prevent stale cache.');
                });
              }
            });
            // Clear caches as well for good measure
            if (window.caches) {
              caches.keys().then(names => {
                for (let name of names) caches.delete(name);
              });
            }
            return;
          }

          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
        };
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </head>
